<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEXC Futures Control</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>MEXC Futures Control</h1>
          <p>Local trading console with dry-run, exchange SL/TP and manual controls.</p>
        </div>
        <div class="mode-pill" id="runState">Stopped</div>
      </section>

      <section class="dashboard">
        <article class="metric">
          <span>Price</span>
          <strong id="price">-</strong>
        </article>
        <article class="metric">
          <span>Position</span>
          <strong id="position">none</strong>
        </article>
        <article class="metric">
          <span>Unrealized PnL</span>
          <strong id="pnl">0.0000 USDT</strong>
        </article>
        <article class="metric">
          <span>Trades / W-L</span>
          <strong id="trades">0 / 0-0</strong>
        </article>
      </section>

      <section class="layout">
        <form id="configForm" class="panel config-panel">
          <div class="panel-head">
            <h2>Setup</h2>
            <button type="button" class="ghost" id="reloadSaved">Reload</button>
          </div>

          <div class="grid two">
            <label>
              <span>WEB token</span>
              <input name="authToken" type="password" autocomplete="off" />
            </label>
            <label>
              <span>Symbol</span>
              <div class="inline">
                <select name="symbolSelect"></select>
                <input name="symbol" placeholder="BTC_USDT" />
              </div>
            </label>
            <label>
              <span>Margin USDT</span>
              <input name="margin" type="number" min="0.1" step="0.1" />
            </label>
            <label>
              <span>Leverage</span>
              <input name="leverage" type="number" min="1" max="200" step="1" />
            </label>
            <label>
              <span>Direction</span>
              <select name="directionMode">
                <option value="both">both</option>
                <option value="auto">auto</option>
                <option value="long">long</option>
                <option value="short">short</option>
              </select>
            </label>
            <label>
              <span>Strategy</span>
              <select name="strategyName"></select>
            </label>
          </div>

          <div id="strategyParams" class="grid two"></div>

          <div class="section-title">Targets</div>
          <div class="grid two">
            <label>
              <span>Take profit mode</span>
              <select name="takeProfitMode">
                <option value="profitUsdt">Profit in USDT</option>
                <option value="roePercent">ROE on margin %</option>
                <option value="pricePercent">Price move %</option>
              </select>
            </label>
            <label>
              <span>Take profit value</span>
              <input name="takeProfitValue" type="number" min="0.01" step="0.01" />
            </label>
            <label>
              <span>Stop loss mode</span>
              <select name="stopLossMode">
                <option value="profitUsdt">Max loss in USDT</option>
                <option value="roePercent">Loss on margin %</option>
                <option value="pricePercent">Price move %</option>
              </select>
            </label>
            <label>
              <span>Stop loss value</span>
              <input name="stopLossValue" type="number" min="0.01" step="0.01" />
            </label>
            <label>
              <span>Manual SL ROE %</span>
              <input name="manualStopLossRoePercent" type="number" min="0.01" step="0.01" />
            </label>
          </div>

          <div class="section-title">Trailing / Chasing</div>
          <div class="grid two">
            <label class="check"><input name="trailingEnabled" type="checkbox" /> Trailing TP</label>
            <label class="check"><input name="chasingEnabled" type="checkbox" /> Chasing TP</label>
            <label>
              <span>Trail activation %</span>
              <input name="trailStartPercent" type="number" min="0.01" step="0.01" />
            </label>
            <label>
              <span>Trail distance %</span>
              <input name="trailDistancePercent" type="number" min="0.01" step="0.01" />
            </label>
            <label>
              <span>Chase activation %</span>
              <input name="chaseActivationPercent" type="number" min="0.01" step="0.01" />
            </label>
            <label>
              <span>Chase rollback %</span>
              <input name="chaseDistancePercent" type="number" min="0.01" step="0.01" />
            </label>
          </div>

          <div class="section-title">Session</div>
          <div class="grid two">
            <label>
              <span>Max trades</span>
              <input name="maxTradesPerSession" type="number" min="1" step="1" />
            </label>
            <label>
              <span>Max losses</span>
              <input name="maxConsecutiveLosses" type="number" min="1" step="1" />
            </label>
            <label>
              <span>Daily loss USDT</span>
              <input name="maxDailyLoss" type="number" min="0.1" step="0.1" />
            </label>
            <label>
              <span>Cooldown sec</span>
              <input name="cooldownSeconds" type="number" min="0" step="1" />
            </label>
            <label>
              <span>Tick interval ms</span>
              <input name="tickIntervalMs" type="number" min="500" step="100" />
            </label>
            <label class="check"><input name="debug" type="checkbox" /> Debug logs</label>
          </div>

          <div class="live-row">
            <label class="check"><input name="dryRun" type="checkbox" /> Dry-run</label>
            <input name="liveConfirmation" placeholder="Type YES LIVE for real orders" />
          </div>

          <div class="actions">
            <button type="submit" class="primary" id="startBtn">Start bot</button>
            <button type="button" class="danger" id="stopBtn">Stop</button>
          </div>
        </form>

        <aside class="side">
          <section class="panel">
            <div class="panel-head">
              <h2>Manual</h2>
              <span class="hint">Queued on next tick</span>
            </div>
            <div class="manual-grid">
              <button class="long" data-action="BUY">Long</button>
              <button class="short" data-action="SELL">Short</button>
              <button class="close" data-action="CLOSE">Close</button>
            </div>
          </section>

          <section class="panel log-panel">
            <div class="panel-head">
              <h2>Logs</h2>
              <button type="button" class="ghost" id="clearLogs">Clear</button>
            </div>
            <div id="logs" class="logs"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
